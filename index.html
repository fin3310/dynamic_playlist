<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>涅露茉茉歌單</title>
    <!-- 引入 Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隱藏捲軸但保持可捲動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 沉穩的深色菱格紋背景，對應裙子與頭髮的暗色調 */
        body {
            background-color: #0f172a; 
            background-image: radial-gradient(#1e293b 2px, transparent 2px); 
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="text-slate-300 min-h-screen font-sans selection:bg-sky-500 selection:text-white">

    <div class="max-w-6xl mx-auto px-4 py-8 relative">
        <!-- 頂部標題與控制列 -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-slate-800/80 backdrop-blur-md p-4 rounded-2xl shadow-lg border border-slate-700">
            <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-300 drop-shadow-sm flex items-center gap-2">
                🎵 涅露茉茉歌單
            </h1>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <!-- 搜尋列 -->
                <input type="text" id="searchInput" placeholder="搜尋歌名、歌手或關鍵字..." 
                       class="w-full md:w-64 px-4 py-2 rounded-full bg-slate-900 border border-slate-600 focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400 transition-all text-slate-100 placeholder-slate-500 shadow-inner">
                
                <!-- 緊湊模式切換按鈕 -->
                <button id="toggleViewBtn" onclick="toggleViewMode()" 
                        class="shrink-0 px-4 py-2 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-600 transition-colors flex items-center gap-2 text-sm text-slate-300 shadow-sm font-medium">
                    <span>👁️</span> <span id="viewModeText">隱藏封面</span>
                </button>
            </div>
        </header>

        <!-- 標籤篩選區 -->
        <div class="flex gap-2 mb-8 overflow-x-auto no-scrollbar pb-2" id="filterContainer">
            <button class="filter-btn active px-5 py-1.5 rounded-full bg-sky-500 text-white text-sm whitespace-nowrap shadow-md shadow-sky-900/50 font-medium border border-transparent transition-all" onclick="setFilter('全部')">全部</button>
            <button class="filter-btn px-5 py-1.5 rounded-full bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-sky-300 text-sm whitespace-nowrap border border-slate-600 shadow-sm transition-all" onclick="setFilter('日文')">日文</button>
            <button class="filter-btn px-5 py-1.5 rounded-full bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-sky-300 text-sm whitespace-nowrap border border-slate-600 shadow-sm transition-all" onclick="setFilter('中文')">中文</button>
            <button class="filter-btn px-5 py-1.5 rounded-full bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-sky-300 text-sm whitespace-nowrap border border-slate-600 shadow-sm transition-all" onclick="setFilter('英文')">英文</button>
        </div>

        <!-- 歌曲卡片容器 -->
        <div id="songsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 transition-all duration-300">
            <!-- 歌曲卡片將由 JavaScript 動態產生於此 -->
        </div>
    </div>

    <!-- 浮動提示訊息 (Toast) -->
    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 px-6 py-3 bg-sky-600 text-white rounded-full shadow-xl shadow-slate-900/50 transition-all duration-300 translate-y-20 opacity-0 pointer-events-none z-50 flex items-center gap-2 font-medium">
        <!-- 訊息內容 -->
    </div>

    <script>
        // --- 變數初始化 ---
        let songsData = []; // 準備接收 JSON 資料的空陣列
        let currentFilter = '全部';
        let searchQuery = '';
        let isCompactMode = false;

        // --- 核心功能 ---

        // 切換緊湊/完整模式
        function toggleViewMode() {
            isCompactMode = !isCompactMode;
            document.getElementById('viewModeText').innerText = isCompactMode ? '顯示封面' : '隱藏封面';
            
            const container = document.getElementById('songsContainer');
            if (isCompactMode) {
                container.classList.remove('md:grid-cols-2', 'lg:grid-cols-3', 'gap-6');
                container.classList.add('grid-cols-1', 'gap-3');
            } else {
                container.classList.add('md:grid-cols-2', 'lg:grid-cols-3', 'gap-6');
                container.classList.remove('grid-cols-1', 'gap-3');
            }
            renderSongs();
        }

        // 複製到剪貼簿 (支援手機測試與舊版瀏覽器的加強版)
        async function copyToClipboard(title, artist) {
            const textToCopy = `${title} - ${artist}`;
            
            // 方法 1：嘗試使用現代的 Clipboard API (需在 HTTPS 或是 localhost 環境)
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(textToCopy);
                    showToast(`✨ 已複製：${textToCopy}`);
                    return; 
                } catch (err) {
                    console.warn('現代複製 API 失敗，嘗試使用備用方案...', err);
                }
            }
            
            // 方法 2：傳統備用方案 
            try {
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                
                textArea.style.position = "fixed";
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.opacity = "0";
                textArea.style.pointerEvents = "none";
                
                document.body.appendChild(textArea);
                
                textArea.focus();
                textArea.select();
                textArea.setSelectionRange(0, 99999); 
                
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                
                if (successful) {
                    showToast(`✨ 已複製：${textToCopy}`);
                } else {
                    showToast('❌ 複製失敗，請手動選取');
                }
            } catch (err) {
                console.error('備用複製方案失敗', err);
                showToast('❌ 複製失敗，您的瀏覽器可能不支援');
            }
        }

        // 顯示浮動提示訊息
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // 設定分類標籤篩選
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.innerText === filter) {
                    btn.className = "filter-btn active px-5 py-1.5 rounded-full bg-sky-500 text-white text-sm whitespace-nowrap shadow-md shadow-sky-900/50 font-medium border border-transparent transition-all";
                } else {
                    btn.className = "filter-btn px-5 py-1.5 rounded-full bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-sky-300 text-sm whitespace-nowrap border border-slate-600 shadow-sm transition-all";
                }
            });
            renderSongs();
        }

        // 監聽搜尋列輸入
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderSongs();
        });

        // 渲染歌曲卡片
        function renderSongs() {
            const container = document.getElementById('songsContainer');
            container.innerHTML = '';

            const filteredSongs = songsData.filter(song => {
                const matchFilter = currentFilter === '全部' || song.language === currentFilter;
                const matchSearch = song.title.toLowerCase().includes(searchQuery) || 
                                    song.artist.toLowerCase().includes(searchQuery) ||
                                    song.note.toLowerCase().includes(searchQuery);
                return matchFilter && matchSearch;
            });

            if (filteredSongs.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500 font-medium">找不到符合條件的歌曲 😢</div>';
                return;
            }

            filteredSongs.forEach(song => {
                // 標籤樣式
                const tagsHtml = song.tags.map(tag => `<span class="px-2 py-1 bg-slate-900/80 text-xs rounded text-sky-300 font-medium border border-slate-700">${tag}</span>`).join('');
                const noteHtml = song.note ? `<p class="text-xs text-sky-400 mt-1 font-medium">♪ ${song.note}</p>` : '';

                let cardHtml = '';

                if (isCompactMode) {
                    // --- 緊湊模式 HTML ---
                    cardHtml = `
                        <div class="bg-slate-800 rounded-xl p-3 hover:bg-slate-700/80 transition-colors flex items-center justify-between border border-slate-700 shadow-sm group">
                            <div class="flex-1 min-w-0 pr-4 pl-2 border-l-4 border-sky-500">
                                <h3 class="text-base font-bold text-slate-100 truncate">${song.title}</h3>
                                <p class="text-sm text-slate-400 truncate">${song.artist}</p>
                            </div>
                            
                            <div class="flex items-center gap-2 shrink-0 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                                ${song.youtube_url ? `<a href="${song.youtube_url}" target="_blank" class="p-2 rounded-full bg-slate-900 text-slate-400 hover:bg-red-500 hover:text-white transition-colors" title="試聽"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg></a>` : ''}
                                <button onclick="copyToClipboard('${song.title.replace(/'/g, "\\'")}', '${song.artist.replace(/'/g, "\\'")}')" class="px-4 py-1.5 bg-sky-500 hover:bg-sky-400 text-white text-sm font-medium rounded-full shadow-md shadow-sky-900/50 transition-all active:scale-95">
                                    點播
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    // --- 完整模式 HTML ---
                    cardHtml = `
                        <div class="bg-slate-800 rounded-2xl overflow-hidden shadow-md border border-slate-700 hover:border-slate-500 hover:shadow-lg transition-all duration-300 group flex flex-col">
                            <div class="relative aspect-video overflow-hidden bg-slate-900">
                                <img src="${song.cover_url}" alt="Cover" class="w-full h-full object-cover group-hover:scale-105 transition duration-700 opacity-90 group-hover:opacity-100">
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/20 to-transparent opacity-90"></div>
                                <div class="absolute bottom-3 left-3 right-3 flex gap-2 flex-wrap">
                                    ${tagsHtml}
                                </div>
                            </div>
                            
                            <div class="p-5 flex-1 flex flex-col">
                                <h3 class="text-lg font-bold text-slate-100 mb-1 line-clamp-1" title="${song.title}">${song.title}</h3>
                                <p class="text-sm text-slate-400 mb-2 line-clamp-1">${song.artist}</p>
                                ${noteHtml}
                                
                                <div class="mt-auto pt-4 flex gap-3">
                                    <button onclick="copyToClipboard('${song.title.replace(/'/g, "\\'")}', '${song.artist.replace(/'/g, "\\'")}')" class="flex-1 py-2 bg-sky-500 hover:bg-sky-400 text-white font-medium rounded-xl shadow-md transition-all active:scale-95 flex justify-center items-center gap-2">
                                        <span>📋</span> 複製點播
                                    </button>
                                    ${song.youtube_url ? `<a href="${song.youtube_url}" target="_blank" class="px-4 py-2 bg-slate-700 hover:bg-red-500 hover:text-white text-slate-300 font-medium rounded-xl border border-slate-600 transition-colors flex justify-center items-center" title="YouTube 試聽"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg></a>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML += cardHtml;
            });
        }

        // --- 網頁載入時執行非同步讀取 ---
        async function loadSongsData() {
            try {
                // 發送請求讀取同一層目錄下的 playlist.json
                const response = await fetch('./playlist.json');
                if (!response.ok) {
                    throw new Error('無法讀取資料');
                }
                
                // 將讀取到的文字轉換成 JSON 格式並存入變數
                songsData = await response.json();
                
                // 資料準備好之後，才呼叫渲染畫面的函式
                renderSongs();
                
            } catch (error) {
                console.error("載入失敗：", error);
                const container = document.getElementById('songsContainer');
                container.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400 font-medium">讀取歌單資料失敗，請確認 playlist.json 是否已成功上傳 😢</div>';
            }
        }

        // 啟動讀取程序
        loadSongsData();
    </script>
</body>
</html>
